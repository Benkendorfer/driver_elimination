[project]
name = "driver-elimination"
version = "0.1.0"
description = "Tracks when each F1 driver is mathematically eliminated from the championship"
requires-python = ">=3.14"
dependencies = [
    "pulp>=3.3.2",
    "requests>=2.34.2",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

# Google Python Style Guide (https://google.github.io/styleguide/pyguide.html), as far as ruff can check it
[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # pep8 naming
    "D",       # docstrings
    "B",       # likely bugs
    "UP",      # modern syntax for the target Python
    "PL",      # pylint (Google's own linter)
    "ANN",     # missing type hints
    "A",       # shadowing built-ins like `round`, `id`, `type`
    "DTZ",     # datetimes without a time zone
    "G", "LOG",  # logging calls (Google style: %-args, not f-strings)
    "SIM",     # simplifiable code
    "RET",     # inconsistent or unnecessary returns
    "C4",      # list/dict/set comprehensions
    "PTH",     # pathlib instead of os.path
    "PERF",    # slow patterns in loops
    "ARG",     # unused arguments
    "FBT",     # boolean positional arguments (make them keyword-only with `*`)
    "RUF",     # ruff's own checks
    "PT",      # pytest style
]
ignore = [
    "PLR2004",  # magic-value comparisons; too noisy for points tables
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["typing", "collections.abc"]
